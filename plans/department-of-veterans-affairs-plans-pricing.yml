specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Department of Veterans Affairs (VA)
providerId: department-of-veterans-affairs
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Federal Government
  - Healthcare
  - Veterans
description: The VA API Platform (developer.va.gov, the Lighthouse program) is operated as a public-sector
  developer platform with no published commercial pricing. Access is free for both sandbox and production,
  but production access requires an onboarding application that includes terms-of-service review, security
  attestations, and (for clinical/PII APIs such as Benefits Claims and FHIR) Veteran-data-use approval.
  There are no paid tiers; differentiation is between sandbox (mock-data) and production (live VA data)
  environments.
sources:
  - https://developer.va.gov/explore
  - https://developer.va.gov/onboarding/request-prod-access
  - https://developer.va.gov/onboarding/request-sandbox-access
  - https://developer.va.gov/production-access/working-with-va-apis
notes: VA APIs are free of charge. The "plans" below model the access stages (sandbox vs. production)
  rather than commercial tiers; entries reference the documented 60 requests/minute throttle.
plans:
  - id: department-of-veterans-affairs-sandbox
    name: Sandbox
    type: freemium
    description: Self-service sandbox access against mock data for prototyping and testing.
    entries:
      - label: Sandbox API requests
        name: sandbox_requests
        type: rate
        metric: requests_per_minute
        limit: 60
        timeFrame: minute
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Mock-data sandbox at sandbox-api.va.gov
      - name: Self-service API key issuance
      - name: Public documentation
      - name: All catalog APIs (Facilities, Forms, Claims, Intake, Appeals, FHIR, Veteran Confirmation, etc.)
  - id: department-of-veterans-affairs-production
    name: Production
    type: freemium
    description: Live VA data access. Requires production-access application reviewed by the VA Lighthouse
      team; clinical/PII APIs require additional Veteran-data-use approval.
    entries:
      - label: Production API requests
        name: production_requests
        type: rate
        metric: requests_per_minute
        limit: 60
        timeFrame: minute
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Live data at api.va.gov
      - name: Production access onboarding review
      - name: Email support via api@va.gov
      - name: Rate-limit increases case-by-case via support
maintainers:
