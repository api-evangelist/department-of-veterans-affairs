specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Department of Veterans Affairs (VA)
providerId: department-of-veterans-affairs
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Federal Government
  - Healthcare
  - Veterans
  - Rate Limiting
description: The VA API Platform applies a basic platform-wide throttle of 60 requests per minute per
  API key across both sandbox and production environments. Exceeding the limit returns HTTP 429. Increases
  may be requested case-by-case via api@va.gov. Per-API exceptions exist (sandbox quotas may be lower
  for specific APIs such as Benefits Reference Data).
sources:
  - https://developer.va.gov/production-access/working-with-va-apis
  - https://developer.va.gov/explore/api/veteran-confirmation
  - https://developer.va.gov/explore/api/benefits-reference-data/docs
responseCodes:
  throttled: 429
  quotaExceeded: 429
limits:
  - name: Platform default (sandbox)
    scope: api-key
    metric: requests_per_minute
    limit: 60
    timeFrame: minute
    notes: Some sandbox APIs publish reduced limits (e.g. Benefits Reference Data). Sandbox uses sandbox-api.va.gov.
  - name: Platform default (production)
    scope: api-key
    metric: requests_per_minute
    limit: 60
    timeFrame: minute
    notes: Production uses api.va.gov. Higher limits available case-by-case via api@va.gov.
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter when 429 responses are returned.
  - name: Rate-Limit Increases
    description: Increases beyond the default 60 RPM are reviewed case-by-case; email api@va.gov with
      use-case justification.
  - name: Sandbox vs. Production
    description: Sandbox keys are self-service; production keys require an onboarding application reviewed
      by the VA Lighthouse team, with additional Veteran-data-use review for clinical/PII APIs.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
