naftiko: 1.0.0-alpha2
info:
  label: VA Facilities API — NearbyFacilities
  description: 'VA Facilities API — NearbyFacilities. 1 operations. Lead operation: Find facilities near an address or coordinates.
    Self-contained Naftiko capability covering one Department Of Veterans Affairs business surface.'
  tags:
  - Department Of Veterans Affairs
  - NearbyFacilities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY: DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY
capability:
  consumes:
  - type: http
    namespace: va-facilities-nearbyfacilities
    baseUri: https://sandbox-api.va.gov/services/va_facilities/v1
    description: VA Facilities API — NearbyFacilities business capability. Self-contained, no shared references.
    resources:
    - name: nearby
      path: /nearby
      operations:
      - name: findnearby
        method: GET
        description: Find facilities near an address or coordinates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: lat
          in: query
          type: number
        - name: lng
          in: query
          type: number
        - name: street_address
          in: query
          type: string
        - name: city
          in: query
          type: string
        - name: state
          in: query
          type: string
        - name: zip
          in: query
          type: string
        - name: drive_time
          in: query
          type: integer
    authentication:
      type: apikey
      key: apikey
      value: '{{env.DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: va-facilities-nearbyfacilities-rest
    port: 8080
    description: REST adapter for VA Facilities API — NearbyFacilities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/nearby
      name: nearby
      description: REST surface for nearby.
      operations:
      - method: GET
        name: findnearby
        description: Find facilities near an address or coordinates
        call: va-facilities-nearbyfacilities.findnearby
        with:
          lat: rest.lat
          lng: rest.lng
          street_address: rest.street_address
          city: rest.city
          state: rest.state
          zip: rest.zip
          drive_time: rest.drive_time
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: va-facilities-nearbyfacilities-mcp
    port: 9090
    transport: http
    description: MCP adapter for VA Facilities API — NearbyFacilities. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: find-facilities-near-address-coordinates
      description: Find facilities near an address or coordinates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: va-facilities-nearbyfacilities.findnearby
      with:
        lat: tools.lat
        lng: tools.lng
        street_address: tools.street_address
        city: tools.city
        state: tools.state
        zip: tools.zip
        drive_time: tools.drive_time
      outputParameters:
      - type: object
        mapping: $.
