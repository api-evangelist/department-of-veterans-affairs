naftiko: 1.0.0-alpha2
info:
  label: VA Clinical Health API (FHIR) — Observation
  description: 'VA Clinical Health API (FHIR) — Observation. 1 operations. Lead operation: Search Observation resources. Self-contained
    Naftiko capability covering one Department Of Veterans Affairs business surface.'
  tags:
  - Department Of Veterans Affairs
  - Observation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY: DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY
capability:
  consumes:
  - type: http
    namespace: va-clinical-health-fhir-observation
    baseUri: https://sandbox-api.va.gov/services/fhir/v0/r4
    description: VA Clinical Health API (FHIR) — Observation business capability. Self-contained, no shared references.
    resources:
    - name: Observation
      path: /Observation
      operations:
      - name: searchobservations
        method: GET
        description: Search Observation resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          required: true
        - name: category
          in: query
          type: string
        - name: code
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY}}'
  exposes:
  - type: rest
    namespace: va-clinical-health-fhir-observation-rest
    port: 8080
    description: REST adapter for VA Clinical Health API (FHIR) — Observation. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/observation
      name: observation
      description: REST surface for Observation.
      operations:
      - method: GET
        name: searchobservations
        description: Search Observation resources
        call: va-clinical-health-fhir-observation.searchobservations
        with:
          patient: rest.patient
          category: rest.category
          code: rest.code
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: va-clinical-health-fhir-observation-mcp
    port: 9090
    transport: http
    description: MCP adapter for VA Clinical Health API (FHIR) — Observation. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-observation-resources
      description: Search Observation resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: va-clinical-health-fhir-observation.searchobservations
      with:
        patient: tools.patient
        category: tools.category
        code: tools.code
      outputParameters:
      - type: object
        mapping: $.
