naftiko: 1.0.0-alpha2
info:
  label: VA Veteran Confirmation API — Confirmation
  description: 'VA Veteran Confirmation API — Confirmation. 1 operations. Lead operation: Confirm Veteran status. Self-contained
    Naftiko capability covering one Department Of Veterans Affairs business surface.'
  tags:
  - Department Of Veterans Affairs
  - Confirmation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY: DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY
capability:
  consumes:
  - type: http
    namespace: va-veteran-confirmation-confirmation
    baseUri: https://sandbox-api.va.gov/services/veteran_confirmation/v1
    description: VA Veteran Confirmation API — Confirmation business capability. Self-contained, no shared references.
    resources:
    - name: status
      path: /status
      operations:
      - name: confirmveteranstatus
        method: POST
        description: Confirm Veteran status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: apikey
      value: '{{env.DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: va-veteran-confirmation-confirmation-rest
    port: 8080
    description: REST adapter for VA Veteran Confirmation API — Confirmation. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/status
      name: status
      description: REST surface for status.
      operations:
      - method: POST
        name: confirmveteranstatus
        description: Confirm Veteran status
        call: va-veteran-confirmation-confirmation.confirmveteranstatus
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: va-veteran-confirmation-confirmation-mcp
    port: 9090
    transport: http
    description: MCP adapter for VA Veteran Confirmation API — Confirmation. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: confirm-veteran-status
      description: Confirm Veteran status
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: va-veteran-confirmation-confirmation.confirmveteranstatus
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
