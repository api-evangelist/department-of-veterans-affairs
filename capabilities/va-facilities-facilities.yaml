naftiko: 1.0.0-alpha2
info:
  label: VA Facilities API — Facilities
  description: 'VA Facilities API — Facilities. 2 operations. Lead operation: List or search VA facilities. Self-contained
    Naftiko capability covering one Department Of Veterans Affairs business surface.'
  tags:
  - Department Of Veterans Affairs
  - Facilities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY: DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY
capability:
  consumes:
  - type: http
    namespace: va-facilities-facilities
    baseUri: https://sandbox-api.va.gov/services/va_facilities/v1
    description: VA Facilities API — Facilities business capability. Self-contained, no shared references.
    resources:
    - name: facilities
      path: /facilities
      operations:
      - name: listfacilities
        method: GET
        description: List or search VA facilities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: bbox[]
          in: query
          type: array
          description: Bounding box (lng_min, lat_min, lng_max, lat_max)
        - name: ids
          in: query
          type: string
          description: Comma-separated facility IDs
        - name: type
          in: query
          type: string
        - name: services[]
          in: query
          type: array
        - name: state
          in: query
          type: string
        - name: zip
          in: query
          type: string
        - name: visn
          in: query
          type: string
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
    - name: facilities-id
      path: /facilities/{id}
      operations:
      - name: getfacilitybyid
        method: GET
        description: Retrieve a single VA facility
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: apikey
      value: '{{env.DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: va-facilities-facilities-rest
    port: 8080
    description: REST adapter for VA Facilities API — Facilities. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/facilities
      name: facilities
      description: REST surface for facilities.
      operations:
      - method: GET
        name: listfacilities
        description: List or search VA facilities
        call: va-facilities-facilities.listfacilities
        with:
          bbox[]: rest.bbox[]
          ids: rest.ids
          type: rest.type
          services[]: rest.services[]
          state: rest.state
          zip: rest.zip
          visn: rest.visn
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/facilities/{id}
      name: facilities-id
      description: REST surface for facilities-id.
      operations:
      - method: GET
        name: getfacilitybyid
        description: Retrieve a single VA facility
        call: va-facilities-facilities.getfacilitybyid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: va-facilities-facilities-mcp
    port: 9090
    transport: http
    description: MCP adapter for VA Facilities API — Facilities. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-search-va-facilities
      description: List or search VA facilities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: va-facilities-facilities.listfacilities
      with:
        bbox[]: tools.bbox[]
        ids: tools.ids
        type: tools.type
        services[]: tools.services[]
        state: tools.state
        zip: tools.zip
        visn: tools.visn
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-single-va-facility
      description: Retrieve a single VA facility
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: va-facilities-facilities.getfacilitybyid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
