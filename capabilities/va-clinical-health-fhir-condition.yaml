naftiko: 1.0.0-alpha2
info:
  label: VA Clinical Health API (FHIR) — Condition
  description: 'VA Clinical Health API (FHIR) — Condition. 1 operations. Lead operation: Search Condition resources for a
    patient. Self-contained Naftiko capability covering one Department Of Veterans Affairs business surface.'
  tags:
  - Department Of Veterans Affairs
  - Condition
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY: DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY
capability:
  consumes:
  - type: http
    namespace: va-clinical-health-fhir-condition
    baseUri: https://sandbox-api.va.gov/services/fhir/v0/r4
    description: VA Clinical Health API (FHIR) — Condition business capability. Self-contained, no shared references.
    resources:
    - name: Condition
      path: /Condition
      operations:
      - name: searchconditions
        method: GET
        description: Search Condition resources for a patient
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.DEPARTMENT_OF_VETERANS_AFFAIRS_API_KEY}}'
  exposes:
  - type: rest
    namespace: va-clinical-health-fhir-condition-rest
    port: 8080
    description: REST adapter for VA Clinical Health API (FHIR) — Condition. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/condition
      name: condition
      description: REST surface for Condition.
      operations:
      - method: GET
        name: searchconditions
        description: Search Condition resources for a patient
        call: va-clinical-health-fhir-condition.searchconditions
        with:
          patient: rest.patient
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: va-clinical-health-fhir-condition-mcp
    port: 9090
    transport: http
    description: MCP adapter for VA Clinical Health API (FHIR) — Condition. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-condition-resources-patient
      description: Search Condition resources for a patient
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: va-clinical-health-fhir-condition.searchconditions
      with:
        patient: tools.patient
      outputParameters:
      - type: object
        mapping: $.
