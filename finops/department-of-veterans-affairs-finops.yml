principles:
  - name: Visibility
    description: Track consumption against the documented 60 RPM throttle via 429 responses and any internal
      gateway logs; VA does not invoice for consumption.
  - name: Allocation
    description: Tag VA API calls by consuming application and Veteran-facing feature so internal compute/integration
      cost can be attributed to the program owner.
  - name: Optimization
    description: Cache facility and form metadata; batch claims and FHIR queries; coalesce duplicate Veteran
      Confirmation lookups to stay under the 60 RPM platform throttle.
  - name: Accountability
    description: Production access requires a named technical contact accountable for adherence to VA terms,
      Veteran-data-use review, and rate-limit compliance.
